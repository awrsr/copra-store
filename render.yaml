services:
  - type: web
    name: copra-store
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 2 --threads 16 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    disk:
      name: copra-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_FILE
        value: /var/data/copra.db
      - key: STAFF_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SITE_URL
        sync: false
